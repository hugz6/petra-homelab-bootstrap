version: '3'

tasks:
  ipxe:start:
    desc: "Start the iPXE server (requires sudo for dnsmasq)"
    cmds:
      - ./extra/ipxe-server/start.sh

  terraform:proxmox:init:
    desc: "Initialize Proxmox Terraform"
    dir: terraform/proxmox
    cmds:
      - task tf-init

  terraform:proxmox:apply:
    desc: "Apply Proxmox Terraform"
    dir: terraform/proxmox
    cmds:
      - task tf-apply

  kubespray:install:
    desc: "Run Kubespray to install the cluster"
    dir: kubespray
    cmds:
      - task deploy
