# This inventory describe a HA typology with stacked etcd (== same nodes as control plane)
# and 3 worker nodes
# See https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# for tips on building your # inventory

# Configure 'ip' variable to bind kubernetes services on a different ip than the default iface
# We should set etcd_member_name for etcd cluster. The node that are not etcd members do not need to set the value,
# or can set the empty string value.
[kube_control_plane]
k8s-cp-1 ansible_host=192.168.1.211 ansible_user=ubuntu ip=192.168.1.211 etcd_member_name=etcd1
k8s-cp-2 ansible_host=192.168.1.212 ansible_user=ubuntu ip=192.168.1.212 etcd_member_name=etcd2
k8s-cp-3 ansible_host=192.168.1.213 ansible_user=ubuntu ip=192.168.1.213 etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[kube_node]
k8s-w-1 ansible_host=192.168.1.221 ansible_user=ubuntu ip=192.168.1.221
k8s-w-2 ansible_host=192.168.1.222 ansible_user=ubuntu ip=192.168.1.222
k8s-w-3 ansible_host=192.168.1.223 ansible_user=ubuntu ip=192.168.1.223

